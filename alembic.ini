# Alembic configuration for ServiceDesk Copilot.
#
# No database URL is committed. The URL is resolved at runtime by
# alembic/env.py from Settings (SDC_DATABASE_PATH, defaulting to
# <runtime>/servicedesk.db), or supplied by a test as a programmatic
# connection through config.attributes["connection"].

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os
