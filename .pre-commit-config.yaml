# Configuration only. Hooks are NOT installed and NOT run in Gate B0.
# Script-file execution is blocked on the B0 machine, so these hooks are for
# later gates and for CI, not for this gate.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
